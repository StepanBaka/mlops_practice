version: "3.8"

services:
  inference_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops_titanic_api:latest
    container_name: titanic_ml_service
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3